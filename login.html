<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JedQuest Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>JedQuest Planner</h1>
            <h2 id="auth-title">Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <form id="signup-form" style="display: none;">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required>
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <div class="auth-divider">
                <span>OR</span>
            </div>
            <button id="google-signin-btn" class="google-btn">Sign in with Google</button>
            <p class="auth-toggle">
                <span id="toggle-text">Need an account?</span>
                <button id="toggle-auth-btn">Sign Up</button>
            </p>
             <p class="auth-back">
                <a href="index.html">&larr; Back to Planner</a>
            </p>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
