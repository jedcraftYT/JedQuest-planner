<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JedQuest Planner</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>JedQuest Planner</h1>
            <div id="countdown-timer"></div>
        </header>

        <main>
            <div class="left-panel">
                <section id="progress-tracker">
                    <h2>Progress</h2>
                    <p>Level: <span id="level">1</span></p>
                    <div class="xp-bar-container">
                        <div id="xp-bar"></div>
                    </div>
                    <p>XP: <span id="xp-points">0</span> / <span id="xp-to-next-level">100</span></p>
                    <p>Streak: <span id="streak-days">0</span> days</p>
                </section>

                <section id="pomodoro-timer">
                    <h2>Pomodoro Timer</h2>
                    <h3 id="pomodoro-mode">Focus</h3>
                    <div id="pomodoro-display">45:00</div>
                    <button id="start-pomodoro">Start</button>
                    <button id="pause-pomodoro">Pause</button>
                    <button id="reset-pomodoro">Reset</button>
                </section>

                <section id="rewards">
                    <h2>Rewards</h2>
                    <ul id="rewards-list"></ul>
                </section>

                <section id="settings">
                    <h2>Settings</h2>
                    <button id="open-settings-btn">Open Settings</button>
                </section>
            </div>

            <div class="right-panel">
                <section id="quest-board">
                    <div class="quest-header">
                        <h2>Quest Board</h2>
                        <button id="add-quest-btn">+ Add Quest</button>
                    </div>
                    <div class="filter-controls">
                        <select id="filter-category">
                            <option value="all">All Categories</option>
                            <option value="NSAT">NSAT Study</option>
                            <option value="JedBot">JedBot Build</option>
                            <option value="Personal">Personal</option>
                        </select>
                    </div>
                    <ul id="quest-list">
                        <!-- Quests will be dynamically added here -->
                    </ul>
                </section>
            </div>
        </main>
    </div>

    <!-- Add/Edit Quest Modal -->
    <div id="quest-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <form id="quest-form">
                <h3 id="modal-title">Add New Quest</h3>
                <input type="hidden" id="quest-id">
                <div class="form-group">
                    <label for="quest-name">Quest Name</label>
                    <input type="text" id="quest-name" required placeholder="e.g., Physics Chapter 3">
                </div>
                <div class="form-group">
                    <label for="quest-category">Category</label>
                    <select id="quest-category">
                        <option value="NSAT">NSAT Study</option>
                        <option value="JedBot">JedBot Build</option>
                        <option value="Personal">Personal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quest-priority">Priority</label>
                    <select id="quest-priority">
                        <option value="1">Low</option>
                        <option value="2">Medium</option>
                        <option value="3">High</option>
                    </select>
                </div>
                 <div class="form-group">
                    <label for="quest-xp">XP Value</label>
                    <input type="number" id="quest-xp" value="50" min="10">
                </div>
                <div class="form-group">
                    <label for="quest-notes">Notes</label>
                    <textarea id="quest-notes" rows="3" placeholder="Add any details or sub-tasks..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" id="save-quest-btn">Save Quest</button>
                    <button type="button" id="cancel-quest-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Settings</h3>
            <form id="settings-form">
                <div class="form-group">
                    <label for="theme-select">Theme</label>
                    <select id="theme-select">
                        <option value="cyber-neon">Cyber Neon</option>
                        <option value="light-mode">Light Mode</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="focus-duration">Focus Duration (minutes)</label>
                    <input type="number" id="focus-duration" min="5" max="60" step="1">
                </div>
                <div class="form-group">
                    <label for="break-duration">Break Duration (minutes)</label>
                    <input type="number" id="break-duration" min="1" max="30" step="1">
                </div>
                <div class="form-group">
                    <label class="toggle-switch">
                        Enable Sound Notifications
                        <input type="checkbox" id="sound-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <hr>
                <div class="form-group">
                    <button type="button" id="reset-progress-from-settings" class="btn-danger">Reset All Progress</button>
                </div>
                <div class="form-actions">
                    <button type="button" id="close-settings-btn">Close</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
    <audio id="notification-sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3" preload="auto"></audio>
</body>
</html>
